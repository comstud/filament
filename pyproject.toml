# Filament build configuration.
#
# Modern PEP 517/518/621 build. The C extensions and the custom build-time
# logic (greenlet-header discovery, fiber-core config generation, OPT/debug
# flag tuning) live in setup.py -- setuptools reads ext_modules from there
# while all *metadata* is declared here.
#
# Python 3.8+ builds through this file (pip / build / cibuildwheel). Python 2.7
# is test-only: it never reads pyproject.toml and is built with the legacy
# `python setup.py build_ext --inplace` path, which only needs ext_modules.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filament"
version = "0.9.1"
description = "Filament: Microthreads for Python"
readme = "README.md"
requires-python = ">=3.8"
# Classic PEP 621 table form (not the PEP 639 SPDX string): the SPDX string
# needs setuptools>=77, which cannot install on Python 3.8. The table form is
# accepted across the whole supported setuptools range so `setup.py build_ext`
# works on 3.8 too. license-files lives under [tool.setuptools] for the same
# reason (the [project].license-files key is also PEP 639 / setuptools>=77).
license = { text = "MIT" }
authors = [{ name = "Chris Behrens", email = "cbehrens@codestud.com" }]
keywords = ["greenlet", "coroutine", "microthread", "concurrency", "gevent", "eventlet"]
dependencies = ["greenlet>=0.4.0"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/comstud/filament"
Source = "https://github.com/comstud/filament"

[project.optional-dependencies]
# Runs the full core + drop-in-shim suite. The gevent/eventlet compat tests
# exercise filament's own shims (via gc.install()), so they need only filament
# itself -- not the real libraries.
test = ["pytest", "testtools"]
# Adds the one comparison test (tests/test_wsgi.py) that imports the real
# gevent for an apples-to-apples WSGI check.
compat-test = ["gevent"]

# NOTE ON VERSIONING: pbr previously derived the version from git tags. There
# are no tags yet, so a static version is used here. Once a tag scheme exists,
# setuptools-scm is the drop-in modern replacement -- deliberately not adopted
# now to avoid a build-time import that would break the legacy py2.7 path.

[tool.setuptools]
# Extensions and custom build logic are defined in setup.py.
license-files = ["LICENSE", "LICENSE.PSF"]
packages = ["filament", "filament.gevent_compat", "filament.eventlet_compat", "_filament"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage notes (py3 only; run with COVERAGE_CORE=sysmon on 3.12+):
#  * Much of the suite runs scenarios in fresh subprocesses (tests/_helpers.py
#    run_py) that end with os._exit -- "patch" below makes coverage follow the
#    children and save data even through os._exit.
#  * The default C tracer does not follow filament context switches, so code
#    executed inside spawned filaments is invisible to it. The sys.monitoring
#    core (COVERAGE_CORE=sysmon) is process-global and sees all of it.
[tool.coverage.run]
source = ["filament"]
parallel = true
patch = ["subprocess", "_exit"]

[tool.coverage.report]
precision = 1
