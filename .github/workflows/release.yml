name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build manylinux wheels for cp39-cp314, plus the free-threaded cp314t, on
  # amd64 and native arm64 runners.
  # 3.15 is intentionally excluded from published wheels while it is a beta; the
  # CI workflow still tests it. To add it once it ships, extend CIBW_BUILD
  # (and bump EXPECTED_WHEELS below). While it is still a beta it would also
  # need CIBW_ENABLE: "cpython-prerelease".
  wheels:
    name: wheels (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        # v2.22 had no cp314/cp314t identifiers at all, and cibuildwheel
        # silently ignores CIBW_BUILD selectors that match nothing -- that is
        # how the 3.14 wheels went missing from v0.9.4/v0.9.5a1. The count
        # check below turns any future silent drop into a hard failure.
        uses: pypa/cibuildwheel@v4.1
        env:
          # cp314t is the free-threaded build. "cp314-*" does NOT match it --
          # the free-threaded interpreters are separate identifiers. Since
          # cibuildwheel 3.2 they build by default (the old
          # CIBW_ENABLE: cpython-freethreading opt-in was removed in 4.0).
          # Only 3.14t is published: that is the free-threaded runtime
          # filament has been validated against.
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
          CIBW_SKIP: "*-musllinux_*"
          # Native 64-bit only. Without this an x86_64 runner also builds
          # i686, whose only image is manylinux2014 (CentOS 7) — no dnf, and
          # nobody needs 32-bit wheels.
          CIBW_ARCHS: "auto64"
          # manylinux_2_28 = AlmaLinux 8 (dnf). libevent is bundled into each
          # wheel by auditwheel; bluez-libs-devel provides AF_BLUETOOTH headers.
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"
          CIBW_BEFORE_ALL_LINUX: "dnf install -y libevent-devel bluez-libs-devel"
          # Exercise the built wheel (first real run of the x86_64 fiber-core
          # asm). If the fiber path fails on x86_64, pin FIL_FIBER_CORE=0 via
          # CIBW_ENVIRONMENT for that leg until the asm is validated.
          CIBW_TEST_REQUIRES: "pytest testtools greenlet"
          # Copy the tests out of the source tree and run them from the temp
          # cwd: tests/ is a package, so running pytest against {project}
          # directly would prepend {project} to sys.path and the source tree
          # (no built extensions) would shadow the installed wheel.
          CIBW_TEST_COMMAND: "cp -r {project}/tests . && python -m pytest tests -q --ignore=tests/test_wsgi.py"

      - name: Verify wheel count
        # One wheel per CIBW_BUILD selector. cibuildwheel ignores selectors
        # that match no known interpreter, so a stale pin shows up here
        # instead of as a quietly incomplete release.
        env:
          EXPECTED_WHEELS: "7"
        run: |
          count=$(ls wheelhouse/*.whl | wc -l)
          ls -l wheelhouse/
          if [ "$count" -ne "$EXPECTED_WHEELS" ]; then
            echo "::error::expected $EXPECTED_WHEELS wheels, built $count"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  # Source distribution. Validated by installing it in a clean environment,
  # which is what catches a missing C source in MANIFEST.in.
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libevent-dev libbluetooth-dev build-essential

      - uses: astral-sh/setup-uv@v6

      - name: Build sdist
        run: uvx --from build pyproject-build --sdist

      - name: Verify sdist installs from a clean tree
        # The import check runs from a temp dir: `python -c` puts the cwd on
        # sys.path, and from the repo root the source tree would shadow the
        # installed package.
        run: |
          uv venv --python 3.13 .verify
          uv pip install --python .verify greenlet pytest
          uv pip install --python .verify dist/*.tar.gz
          cd "$(mktemp -d)" && "$GITHUB_WORKSPACE/.verify/bin/python" -c "import filament, _filament.core, _fil_greenlet"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  # Attach the wheels and sdist to a GitHub Release. Tags only; no PyPI
  # publishing.
  publish:
    name: publish
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # attach files to the GitHub Release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
